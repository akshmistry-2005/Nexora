services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_local_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-nexora_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres-dbs.sql:/docker-entrypoint-initdb.d/init-postgres-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora_user} -d ${POSTGRES_DB:-nexora_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexora_pgdata:
    name: nexora_pgdata
