[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-backend"
version = "0.2.0"
description = "Nexora Enterprise Data Intelligence & Business Analytics Platform — Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-multipart>=0.0.17,<1.0.0",
    "numpy>=2.1.0,<3.0.0",
    "passlib[argon2]>=1.7.4,<2.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "pyjwt>=2.9.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "httpx>=0.27.2,<1.0.0",
    "ruff>=0.7.4,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "W291", "W293"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "m02: Module 2 environment and health checks",
    "m03: Module 3 database design and synthetic data",
    "m04: Module 4 backend foundation and API standards",
    "m05: Module 5 authentication, roles and permissions",
    "m06: Module 6 frontend foundation and design system",
    "m07: Module 7 data ingestion and source management",
    "m08: Module 8 data cleaning and quality",
    "m09: Module 9 core business intelligence modules",
    "m10: Module 10 reports and exports",
    "m11: Module 11 statistical analysis",
    "m12: Module 12 predictive analytics",
    "m13: Module 13 anomaly detection",
    "m14: Module 14 pipeline monitoring and administration",
    "m15: Module 15 integration and security QA",
    "m16: Module 16 documentation and handover",
]
